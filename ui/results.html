<!doctype html>
<!--
  DomainScout's results card for hosts that support MCP Apps (Claude, VS Code, ChatGPT and
  others). The host renders this page in a sandboxed iframe under a check_domains call and passes
  the call's result in. Self-contained on purpose: no build step, and nothing loaded from
  elsewhere, so a strict content security policy still lets it run.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DomainScout results</title>
    <style>
      /* The host's theme variables where it sends them, these defaults where it doesn't. */
      :root {
        --ds-text: var(--color-text-primary, #1f1e1d);
        --ds-text-muted: var(--color-text-secondary, #6b6a68);
        --ds-surface: var(--color-background-secondary, #f5f4f1);
        --ds-card: var(--color-background-primary, #ffffff);
        --ds-border: var(--color-border-tertiary, rgba(31, 30, 29, 0.12));
        --ds-border-strong: var(--color-border-secondary, rgba(31, 30, 29, 0.24));
        --ds-success: var(--color-text-success, #2f7a3b);
        --ds-warning: var(--color-text-warning, #8a5a00);
        --ds-warning-bg: var(--color-background-warning, #fbf0d9);
        --ds-info: var(--color-text-info, #1f5fa8);
        --ds-info-bg: var(--color-background-info, #e5effa);
        --ds-radius: var(--border-radius-md, 8px);
        --ds-radius-lg: var(--border-radius-lg, 12px);
        --ds-font: var(--font-sans, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
      }

      :root[data-theme='dark'] {
        --ds-text: var(--color-text-primary, #ecebe8);
        --ds-text-muted: var(--color-text-secondary, #a3a19c);
        --ds-surface: var(--color-background-secondary, #2a2927);
        --ds-card: var(--color-background-primary, #1f1e1d);
        --ds-border: var(--color-border-tertiary, rgba(236, 235, 232, 0.12));
        --ds-border-strong: var(--color-border-secondary, rgba(236, 235, 232, 0.28));
        --ds-success: var(--color-text-success, #7fcf8a);
        --ds-warning: var(--color-text-warning, #f0c062);
        --ds-warning-bg: var(--color-background-warning, #3d3018);
        --ds-info: var(--color-text-info, #8ab8f0);
        --ds-info-bg: var(--color-background-info, #1c2f47);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        padding: 2px 1px 6px;
        color: var(--ds-text);
        font: 14px/1.5 var(--ds-font);
        -webkit-font-smoothing: antialiased;
      }

      button,
      summary {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ds-info);
        outline-offset: 2px;
      }

      .status {
        margin: 8px 0;
        color: var(--ds-text-muted);
      }

      .progress {
        height: 3px;
        margin-top: 10px;
        border-radius: 3px;
        background: var(--ds-border);
        overflow: hidden;
      }

      .progress::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--ds-text-muted);
        animation: slide 1.2s ease-in-out infinite;
      }

      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }

      /* Counts: checked, free, taken, time. */
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 0 0 20px;
      }

      .tile {
        padding: 16px;
        border-radius: var(--ds-radius);
        background: var(--ds-surface);
      }

      .tile__label {
        margin: 0;
        font-size: 13px;
        color: var(--ds-text-muted);
      }

      .tile__value {
        margin: 0;
        font-size: 24px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .tile__value--free {
        color: var(--ds-success);
      }

      /* One compact card per free domain. */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        align-items: start;
        gap: 12px;
        margin: 0 0 20px;
      }

      .card {
        min-width: 0;
        padding: 16px 20px;
        border: 0.5px solid var(--ds-border-strong);
        border-radius: var(--ds-radius-lg);
        background: var(--ds-card);
      }

      .card__name {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 8px;
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }

      .card__check {
        flex: none;
        width: 18px;
        height: 18px;
        color: var(--ds-success);
      }

      .tag {
        padding: 0 6px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 500;
        background: var(--ds-warning-bg);
        color: var(--ds-warning);
      }

      .card__price {
        margin: 0 0 12px;
        font-size: 13px;
        color: var(--ds-text-muted);
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .button {
        padding: 6px 12px;
        border: 0.5px solid var(--ds-border-strong);
        border-radius: var(--ds-radius);
        background: transparent;
        font-size: 13px;
        white-space: nowrap;
      }

      .button:hover,
      .registrar:hover {
        background: var(--ds-surface);
      }

      .arrow {
        margin-left: 4px;
        color: var(--ds-text-muted);
      }

      /* The accordion: every registrar, in the same order on every card. */
      .all {
        margin-top: 10px;
      }

      .all summary {
        width: fit-content;
        font-size: 13px;
        color: var(--ds-text-muted);
        list-style: none;
      }

      .all summary::-webkit-details-marker {
        display: none;
      }

      .all summary::after {
        content: '▾';
        display: inline-block;
        margin-left: 4px;
        transition: transform 0.15s ease;
      }

      .all[open] summary::after {
        transform: rotate(180deg);
      }

      .registrars {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        border-top: 0.5px solid var(--ds-border);
      }

      .registrar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 6px 4px;
        border: 0;
        border-bottom: 0.5px solid var(--ds-border);
        border-radius: 0;
        background: transparent;
        font-size: 13px;
        text-align: left;
      }

      .registrar__price {
        color: var(--ds-text-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* Taken, reserved and unverified names. */
      .label {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--ds-text-muted);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 16px;
      }

      .chip {
        padding: 4px 10px;
        border-radius: var(--ds-radius);
        background: var(--ds-surface);
        color: var(--ds-text-muted);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .chip--taken {
        text-decoration: line-through;
      }

      .chip--dropping {
        background: var(--ds-info-bg);
        color: var(--ds-info);
      }

      .show-all {
        margin: -8px 0 20px;
      }

      .notes {
        margin: 0 0 16px;
        padding-left: 18px;
        color: var(--ds-text-muted);
        font-size: 13px;
      }

      .footnote {
        margin: 0;
        color: var(--ds-text-muted);
        font-size: 11px;
      }

      @media (max-width: 480px) {
        .tiles {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }

        .all summary::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <p class="status">Checking domains…</p>
      <div class="progress" aria-hidden="true"></div>
    </main>

    <script>
      // ── The MCP Apps protocol: JSON-RPC 2.0 over postMessage with the host ─────────────────────

      /** The MCP Apps protocol version this card speaks. */
      const PROTOCOL_VERSION = '2026-01-26';
      /** How this card introduces itself to the host. */
      const APP_INFO = { name: 'DomainScout results', version: '1.0.0' };
      /** The JSON-RPC version of every message. */
      const JSONRPC = '2.0';
      /** Where messages go: the host is the frame that embeds this card. */
      const ANY_ORIGIN = '*';

      /** The protocol's methods this card sends or handles. */
      const Method = {
        Initialize: 'ui/initialize',
        Initialized: 'ui/notifications/initialized',
        ToolInput: 'ui/notifications/tool-input',
        ToolResult: 'ui/notifications/tool-result',
        ToolCancelled: 'ui/notifications/tool-cancelled',
        HostContextChanged: 'ui/notifications/host-context-changed',
        SizeChanged: 'ui/notifications/size-changed',
        OpenLink: 'ui/open-link',
      };

      /** Requests sent to the host that wait for an answer, by id. */
      const pending = new Map();
      let nextRequestId = 1;

      function post(message) {
        window.parent.postMessage({ jsonrpc: JSONRPC, ...message }, ANY_ORIGIN);
      }

      function request(method, params) {
        const id = nextRequestId++;
        post({ id, method, params });
        return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
      }

      function notify(method, params) {
        post({ method, params });
      }

      /** Handlers of the host's notifications. */
      const notificationHandlers = new Map()
        .set(Method.ToolInput, (params) => showChecking(params?.arguments))
        .set(Method.ToolResult, (params) => showResult(params))
        .set(Method.ToolCancelled, () => showMessage('The check was cancelled.'))
        .set(Method.HostContextChanged, (params) => applyHostContext(params));

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== JSONRPC) return;
        if (message.method === undefined) {
          settle(message);
        } else if (message.id !== undefined) {
          // A request from the host (a teardown, a ping): nothing to clean up, so agree at once.
          post({ id: message.id, result: {} });
        } else {
          notificationHandlers.get(message.method)?.(message.params);
        }
      });

      function settle(response) {
        const waiting = pending.get(response.id);
        if (!waiting) return;
        pending.delete(response.id);
        if (response.error) waiting.reject(response.error);
        else waiting.resolve(response.result);
      }

      /** Opens a buy link: the sandbox blocks navigation, so the host opens it. */
      function openLink(url) {
        request(Method.OpenLink, { url }).catch(() => window.open(url, '_blank', 'noopener'));
      }

      // ── The host's look: light or dark, its colors, fonts and radii ────────────────────────────

      function applyHostContext(context) {
        if (!context) return;
        if (context.theme) document.documentElement.dataset.theme = context.theme;
        const variables = context.styles?.variables ?? {};
        for (const [name, value] of Object.entries(variables)) {
          if (value) document.documentElement.style.setProperty(name, value);
        }
        const fonts = context.styles?.css?.fonts;
        if (fonts) {
          const style = document.createElement('style');
          style.textContent = fonts;
          document.head.append(style);
        }
      }

      // ── The card's height follows its content ─────────────────────────────────────────────────

      let reportedWidth = 0;
      let reportedHeight = 0;

      function reportSize() {
        const root = document.documentElement;
        const previous = root.style.height;
        root.style.height = 'max-content';
        const height = Math.ceil(root.getBoundingClientRect().height);
        root.style.height = previous;
        const width = Math.ceil(window.innerWidth);
        if (width === reportedWidth && height === reportedHeight) return;
        reportedWidth = width;
        reportedHeight = height;
        notify(Method.SizeChanged, { width, height });
      }

      // ── Rendering a check_domains result ─────────────────────────────────────────────────────

      /** The tool's domain statuses. */
      const Status = {
        Available: 'available',
        LikelyAvailable: 'likely_available',
        Taken: 'taken',
        Reserved: 'reserved',
        Unknown: 'unknown',
      };
      /** Free domains shown before "Show all": enough to choose from, short enough to scan. */
      const FREE_SHOWN = 24;
      /** Buttons on a card: the two cheapest registrars; every registrar is in the accordion. */
      const CARD_BUTTONS = 2;
      /** Characters of an ISO date that make the day: "2030-02-03". */
      const DATE_LENGTH = 10;
      /** Milliseconds in a second, for the elapsed time. */
      const SECOND_MS = 1000;
      /** The mark after a link that leaves for a registrar's site. */
      const OUT_ARROW = '↗';
      /** A hyphen and a space that never break a line: "2-year minimum" stays whole. */
      const NO_BREAK_HYPHEN = '\u2011';
      const NO_BREAK_SPACE = '\u00a0';
      /** The SVG namespace, for the check mark. */
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const app = document.getElementById('app');

      /** An element with a class and, optionally, text: data always goes in as text, never as HTML. */
      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function money(amount, currency) {
        return new Intl.NumberFormat(undefined, { style: 'currency', currency }).format(amount);
      }

      function showMessage(text) {
        app.replaceChildren(element('p', 'status', text));
      }

      function showChecking(input) {
        const count = Array.isArray(input?.domains) ? input.domains.length : 0;
        const status = element('p', 'status', count ? `Checking ${count} names…` : 'Checking domains…');
        app.replaceChildren(status, element('div', 'progress'));
      }

      function showResult(result) {
        const data = result?.structuredContent;
        if (result?.isError || !data?.results) {
          const text = result?.content?.find((block) => block.type === 'text')?.text;
          showMessage(text ?? 'The check did not return results.');
          return;
        }
        const byStatus = (statuses) => data.results.filter((item) => statuses.includes(item.status));
        const free = byStatus([Status.Available, Status.LikelyAvailable]);
        const taken = byStatus([Status.Taken]);
        const reserved = byStatus([Status.Reserved]);
        const unknown = byStatus([Status.Unknown]);

        const parts = [tiles(data.summary, free.length, taken.length)];
        if (free.length) parts.push(...freeCards(free));
        if (taken.length) parts.push(element('p', 'label', 'Taken'), takenChips(taken));
        if (reserved.length) parts.push(element('p', 'label', 'Reserved'), chips(reserved));
        if (unknown.length) parts.push(element('p', 'label', 'Not verified, try again later'), chips(unknown));
        if (data.warnings?.length) parts.push(notes(data.warnings));
        parts.push(
          element(
            'p',
            'footnote',
            'Registrars are listed cheapest first. Prices are standard yearly prices for the TLD; ' +
              'premium names cost more.' +
              (data.disclosure ? ` ${data.disclosure}` : ''),
          ),
        );
        app.replaceChildren(...parts);
      }

      function tiles(summary, freeCount, takenCount) {
        const seconds = (summary.elapsed_ms / SECOND_MS).toFixed(1);
        const box = element('div', 'tiles');
        const values = [
          ['Checked', String(summary.total), ''],
          ['Free', String(freeCount), 'tile__value--free'],
          ['Taken', String(takenCount), ''],
          ['Time', `${seconds} s`, ''],
        ];
        for (const [label, value, modifier] of values) {
          const tile = element('div', 'tile');
          tile.append(element('p', 'tile__label', label), element('p', `tile__value ${modifier}`, value));
          box.append(tile);
        }
        return box;
      }

      /** The free domains' cards, the first FREE_SHOWN of them until "Show all". */
      function freeCards(free) {
        const box = element('div', 'cards');
        free.slice(0, FREE_SHOWN).forEach((item) => box.append(freeCard(item)));
        if (free.length <= FREE_SHOWN) return [box];
        const showAll = element('button', 'button show-all', `Show all ${free.length} free domains`);
        showAll.addEventListener('click', () => {
          free.slice(FREE_SHOWN).forEach((item) => box.append(freeCard(item)));
          showAll.remove();
        });
        return [box, showAll];
      }

      function freeCard(item) {
        const card = element('article', 'card');
        const name = element('p', 'card__name');
        name.append(checkMark(item.confirmedBy), element('span', '', item.display || item.domain));
        if (item.premium) name.append(element('span', 'tag', 'Premium'));
        card.append(name);

        // The tool lists offers cheapest first, priced ones before the rest: one order for every
        // card, the buttons and the accordion alike.
        const offers = item.buy ?? [];
        const lead = offers.find((offer) => offer.price);
        if (lead) card.append(element('p', 'card__price', priceText(lead.price)));

        const buttons = element('div', 'buttons');
        for (const offer of offers.slice(0, CARD_BUTTONS)) buttons.append(buyButton(offer));
        if (buttons.childElementCount) card.append(buttons);
        if (offers.length > CARD_BUTTONS) card.append(allRegistrars(offers));
        return card;
      }

      /** A green check; its title says who confirmed the name, if a registrar did. */
      function checkMark(confirmedBy) {
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('class', 'card__check');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.setAttribute('aria-hidden', 'true');
        const circle = document.createElementNS(SVG_NS, 'circle');
        circle.setAttribute('cx', '12');
        circle.setAttribute('cy', '12');
        circle.setAttribute('r', '9');
        const tick = document.createElementNS(SVG_NS, 'path');
        tick.setAttribute('d', 'M8.5 12.5l2.5 2.5 4.5-5');
        const title = document.createElementNS(SVG_NS, 'title');
        title.textContent = confirmedBy ? `Confirmed by ${confirmedBy}` : 'Not in the registry';
        svg.append(title, circle, tick);
        return svg;
      }

      /** "$10.46/yr, renews at $10.46", plus the minimum term where there is one. */
      function priceText(price) {
        const parts = [
          `${money(price.registration, price.currency)}/yr`,
          `renews at ${money(price.renewal, price.currency)}`,
        ];
        if (price.minYears > 1) {
          parts.push(`${price.minYears}${NO_BREAK_HYPHEN}year${NO_BREAK_SPACE}minimum`);
        }
        return parts.join(', ');
      }

      function buyButton(offer) {
        const label = offer.price
          ? `${offer.registrar} ${money(offer.price.registration, offer.price.currency)}`
          : offer.registrar;
        const button = element('button', 'button', label);
        button.append(element('span', 'arrow', OUT_ARROW));
        button.addEventListener('click', () => openLink(offer.url));
        return button;
      }

      /** The accordion: every registrar that sells the name, in the tool's order. */
      function allRegistrars(offers) {
        const details = element('details', 'all');
        details.append(element('summary', '', `All ${offers.length} registrars`));
        const list = element('ul', 'registrars');
        for (const offer of offers) {
          const row = element('button', 'registrar');
          const price = offer.price
            ? `${money(offer.price.registration, offer.price.currency)}/yr`
            : 'price on site';
          row.append(element('span', '', offer.registrar), element('span', 'registrar__price', `${price} ${OUT_ARROW}`));
          row.addEventListener('click', () => openLink(offer.url));
          const item = element('li');
          item.append(row);
          list.append(item);
        }
        details.append(list);
        return details;
      }

      function takenChips(items) {
        const box = element('div', 'chips');
        for (const item of items) {
          const dropping = item.registration?.dropping;
          const chip = element('span', dropping ? 'chip chip--dropping' : 'chip chip--taken', item.display || item.domain);
          const expires = item.registration?.expires?.slice(0, DATE_LENGTH);
          if (dropping) chip.title = 'Being deleted: may become available soon';
          else if (expires) chip.title = `Registered until ${expires}`;
          box.append(chip);
        }
        return box;
      }

      function chips(items) {
        const box = element('div', 'chips');
        for (const item of items) {
          const chip = element('span', 'chip', item.display || item.domain);
          if (item.note) chip.title = item.note;
          box.append(chip);
        }
        return box;
      }

      function notes(warnings) {
        const list = element('ul', 'notes');
        for (const warning of warnings) list.append(element('li', '', warning));
        return list;
      }

      // ── Start: introduce the card, take the host's look, then follow the content's size ──────

      async function start() {
        const result = await request(Method.Initialize, {
          appInfo: APP_INFO,
          appCapabilities: {},
          protocolVersion: PROTOCOL_VERSION,
        });
        applyHostContext(result?.hostContext);
        notify(Method.Initialized);
        const observer = new ResizeObserver(() => requestAnimationFrame(reportSize));
        observer.observe(document.documentElement);
        observer.observe(document.body);
        reportSize();
      }

      start();
    </script>
  </body>
</html>

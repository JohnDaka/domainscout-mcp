<!doctype html>
<!--
  DomainScout's results panel for hosts that support MCP Apps (Claude, VS Code, ChatGPT and
  others). The server inlines results.css and results.js in place of the two tags below when a
  host reads the resource, so the page the host gets is one self-contained file.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DomainScout results</title>
    <link rel="stylesheet" href="results.css" />
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script src="results.js"></script>
  </body>
</html>

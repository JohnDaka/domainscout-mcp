<!doctype html>
<!--
  DomainScout's results card for hosts that support MCP Apps (Claude, VS Code, ChatGPT and
  others). The host renders this page in a sandboxed iframe under a check_domains call and passes
  the call's result in. Self-contained on purpose: no build step, and nothing loaded from
  elsewhere, so a strict content security policy still lets it run.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DomainScout results</title>
    <style>
      /*
        The landing page's results panel (domainscout.dakaio.com): a glass panel, a summary line,
        then one row per free domain with its name in monospace, an "Available" pill and its
        price. Dark like the landing page by default, light when the host is light.
      */
      :root {
        --ds-panel: rgba(255, 255, 255, 0.04);
        --ds-panel-border: rgba(255, 255, 255, 0.08);
        --ds-panel-strong: rgba(255, 255, 255, 0.07);
        --ds-divider: rgba(255, 255, 255, 0.06);
        --ds-heading: #ffffff;
        --ds-body: #c7c9ea;
        --ds-muted: #a3a6d1;
        --ds-cyan: #3cc8ff;
        --ds-teal: #11edda;
        --ds-amber: #facc15;
        --ds-orange: #fb923c;
        --ds-font: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
        --ds-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
        --ds-radius: 16px;
        --ds-radius-small: 10px;
      }

      :root[data-theme='light'] {
        --ds-panel: #ffffff;
        --ds-panel-border: rgba(15, 18, 40, 0.1);
        --ds-panel-strong: rgba(15, 18, 40, 0.05);
        --ds-divider: rgba(15, 18, 40, 0.08);
        --ds-heading: #0f1228;
        --ds-body: #3b3f63;
        --ds-muted: #62668c;
        --ds-cyan: #0b7fb3;
        --ds-teal: #087f75;
        --ds-amber: #8a6500;
        --ds-orange: #b4520f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        padding: 1px;
        color: var(--ds-body);
        font: 14px/1.5 var(--ds-font);
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--ds-cyan);
        outline-offset: 2px;
      }

      .panel {
        padding: 20px 24px;
        border: 1px solid var(--ds-panel-border);
        border-radius: var(--ds-radius);
        background: var(--ds-panel);
      }

      /* "DOMAINSCOUT  check_domains", as above the results on the landing page. */
      .tool {
        margin: 0 0 8px;
        font-family: var(--ds-mono);
        font-size: 13px;
        color: var(--ds-cyan);
      }

      .tool__who {
        margin-right: 8px;
        font-family: var(--ds-font);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ds-muted);
      }

      .summary {
        margin: 0 0 6px;
        color: var(--ds-body);
        font-size: 14px;
        font-weight: 600;
      }

      .status {
        margin: 0;
        color: var(--ds-muted);
      }

      .progress {
        height: 3px;
        margin-top: 12px;
        border-radius: 3px;
        background: var(--ds-divider);
        overflow: hidden;
      }

      .progress::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--ds-cyan);
        animation: slide 1.2s ease-in-out infinite;
      }

      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }

      /* One row per free domain. */
      .results {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .result {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 12px;
        padding: 10px 0;
        border-top: 1px solid var(--ds-divider);
      }

      .result__domain {
        font-family: var(--ds-mono);
        font-size: 14px;
        color: var(--ds-heading);
        overflow-wrap: anywhere;
      }

      .result__line {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 12px;
      }

      .result__price {
        font-size: 13px;
        color: var(--ds-muted);
      }

      .pill {
        align-self: center;
        padding: 2px 10px;
        border: 1px solid currentColor;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        color: var(--ds-teal);
      }

      .pill--premium {
        color: var(--ds-amber);
      }

      .result__actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        margin-left: auto;
      }

      .buy {
        padding: 4px 10px;
        border: 1px solid var(--ds-panel-border);
        border-radius: var(--ds-radius-small);
        background: var(--ds-panel-strong);
        font-size: 12px;
        color: var(--ds-body);
        white-space: nowrap;
      }

      .buy:hover {
        border-color: var(--ds-cyan);
        color: var(--ds-heading);
      }

      .arrow {
        margin-left: 4px;
        color: var(--ds-muted);
      }

      /* The accordion: every registrar, in the same price order for every domain. */
      .toggle {
        padding: 4px 2px;
        border: 0;
        background: none;
        color: var(--ds-muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .toggle:hover {
        color: var(--ds-heading);
      }

      .toggle::after {
        content: '▾';
        display: inline-block;
        margin-left: 4px;
        transition: transform 0.15s ease;
      }

      .toggle[aria-expanded='true']::after {
        transform: rotate(180deg);
      }

      .registrars {
        grid-column: 1 / -1;
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
      }

      .registrar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        padding: 5px 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        font-size: 13px;
        color: var(--ds-body);
        text-align: left;
      }

      .registrar:hover {
        background: var(--ds-panel-strong);
        color: var(--ds-heading);
      }

      .registrar__price {
        color: var(--ds-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .more {
        margin: 8px 0 0;
        padding: 0;
        border: 0;
        background: none;
        color: var(--ds-muted);
        font-size: 13px;
      }

      .more:hover {
        color: var(--ds-heading);
      }

      /* Taken, reserved and unverified names: muted pills. */
      .group {
        margin: 16px 0 0;
        padding-top: 12px;
        border-top: 1px solid var(--ds-divider);
      }

      .group__label {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ds-muted);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip {
        padding: 2px 10px;
        border: 1px solid var(--ds-divider);
        border-radius: 999px;
        font-family: var(--ds-mono);
        font-size: 12px;
        color: var(--ds-muted);
        overflow-wrap: anywhere;
      }

      .chip--dropping {
        border-color: currentColor;
        color: var(--ds-cyan);
      }

      .chip--reserved {
        color: var(--ds-amber);
      }

      .chip--unknown {
        color: var(--ds-orange);
      }

      .notes {
        margin: 16px 0 0;
        padding-left: 18px;
        color: var(--ds-muted);
        font-size: 13px;
      }

      .footnote {
        margin: 16px 0 0;
        color: var(--ds-muted);
        font-size: 11px;
      }

      @media (max-width: 480px) {
        .panel {
          padding: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }

        .toggle::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <section class="panel">
        <p class="tool"><span class="tool__who">DomainScout</span>check_domains</p>
        <p class="status">Checking domains…</p>
        <div class="progress" aria-hidden="true"></div>
      </section>
    </main>

    <script>
      // ── The MCP Apps protocol: JSON-RPC 2.0 over postMessage with the host ─────────────────────

      /** The MCP Apps protocol version this card speaks. */
      const PROTOCOL_VERSION = '2026-01-26';
      /** How this card introduces itself to the host. */
      const APP_INFO = { name: 'DomainScout results', version: '1.0.0' };
      /** The JSON-RPC version of every message. */
      const JSONRPC = '2.0';
      /** Where messages go: the host is the frame that embeds this card. */
      const ANY_ORIGIN = '*';

      /** The protocol's methods this card sends or handles. */
      const Method = {
        Initialize: 'ui/initialize',
        Initialized: 'ui/notifications/initialized',
        ToolInput: 'ui/notifications/tool-input',
        ToolResult: 'ui/notifications/tool-result',
        ToolCancelled: 'ui/notifications/tool-cancelled',
        HostContextChanged: 'ui/notifications/host-context-changed',
        SizeChanged: 'ui/notifications/size-changed',
        OpenLink: 'ui/open-link',
      };

      /** Requests sent to the host that wait for an answer, by id. */
      const pending = new Map();
      let nextRequestId = 1;

      function post(message) {
        window.parent.postMessage({ jsonrpc: JSONRPC, ...message }, ANY_ORIGIN);
      }

      function request(method, params) {
        const id = nextRequestId++;
        post({ id, method, params });
        return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
      }

      function notify(method, params) {
        post({ method, params });
      }

      /** Handlers of the host's notifications. */
      const notificationHandlers = new Map()
        .set(Method.ToolInput, (params) => showChecking(params?.arguments))
        .set(Method.ToolResult, (params) => showResult(params))
        .set(Method.ToolCancelled, () => showMessage('The check was cancelled.'))
        .set(Method.HostContextChanged, (params) => applyHostContext(params));

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== JSONRPC) return;
        if (message.method === undefined) {
          settle(message);
        } else if (message.id !== undefined) {
          // A request from the host (a teardown, a ping): nothing to clean up, so agree at once.
          post({ id: message.id, result: {} });
        } else {
          notificationHandlers.get(message.method)?.(message.params);
        }
      });

      function settle(response) {
        const waiting = pending.get(response.id);
        if (!waiting) return;
        pending.delete(response.id);
        if (response.error) waiting.reject(response.error);
        else waiting.resolve(response.result);
      }

      /** Opens a buy link: the sandbox blocks navigation, so the host opens it. */
      function openLink(url) {
        request(Method.OpenLink, { url }).catch(() => window.open(url, '_blank', 'noopener'));
      }

      // ── The host's look: light or dark, its colors, fonts and radii ────────────────────────────

      function applyHostContext(context) {
        if (!context) return;
        if (context.theme) document.documentElement.dataset.theme = context.theme;
        const variables = context.styles?.variables ?? {};
        for (const [name, value] of Object.entries(variables)) {
          if (value) document.documentElement.style.setProperty(name, value);
        }
        const fonts = context.styles?.css?.fonts;
        if (fonts) {
          const style = document.createElement('style');
          style.textContent = fonts;
          document.head.append(style);
        }
      }

      // ── The card's height follows its content ─────────────────────────────────────────────────

      let reportedWidth = 0;
      let reportedHeight = 0;

      function reportSize() {
        const root = document.documentElement;
        const previous = root.style.height;
        root.style.height = 'max-content';
        const height = Math.ceil(root.getBoundingClientRect().height);
        root.style.height = previous;
        const width = Math.ceil(window.innerWidth);
        if (width === reportedWidth && height === reportedHeight) return;
        reportedWidth = width;
        reportedHeight = height;
        notify(Method.SizeChanged, { width, height });
      }

      // ── Rendering a check_domains result ─────────────────────────────────────────────────────

      /** The tool's domain statuses. */
      const Status = {
        Available: 'available',
        LikelyAvailable: 'likely_available',
        Taken: 'taken',
        Reserved: 'reserved',
        Unknown: 'unknown',
      };
      /** Free domains listed before "…and N more free": as many as a screen shows. */
      const FREE_SHOWN = 12;
      /** Buy buttons on a row: the two cheapest registrars; the rest are under "All N registrars". */
      const ROW_BUTTONS = 2;
      /** Characters of an ISO date that make the day: "2030-02-03". */
      const DATE_LENGTH = 10;
      /** Milliseconds in a second, for the elapsed time. */
      const SECOND_MS = 1000;
      /** The mark after a link that leaves for a registrar's site. */
      const OUT_ARROW = '↗';
      /** A hyphen and a space that never break a line: "2-year minimum" stays whole. */
      const NO_BREAK_HYPHEN = '‑';
      const NO_BREAK_SPACE = ' ';
      /** What the panel says it is, as on the landing page. */
      const TOOL_WHO = 'DomainScout';
      const TOOL_NAME = 'check_domains';

      const app = document.getElementById('app');
      let nextListId = 1;

      /** An element with a class and, optionally, text: data always goes in as text, never as HTML. */
      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function money(amount, currency) {
        return new Intl.NumberFormat(undefined, { style: 'currency', currency }).format(amount);
      }

      /** The panel with the tool's name on top, then the given parts. */
      function showPanel(...parts) {
        const panel = element('section', 'panel');
        const tool = element('p', 'tool');
        tool.append(element('span', 'tool__who', TOOL_WHO), TOOL_NAME);
        panel.append(tool, ...parts);
        app.replaceChildren(panel);
      }

      function showMessage(text) {
        showPanel(element('p', 'status', text));
      }

      function showChecking(input) {
        const count = Array.isArray(input?.domains) ? input.domains.length : 0;
        showPanel(element('p', 'status', count ? `Checking ${count} names…` : 'Checking domains…'), element('div', 'progress'));
      }

      function showResult(result) {
        const data = result?.structuredContent;
        if (result?.isError || !data?.results) {
          const text = result?.content?.find((block) => block.type === 'text')?.text;
          showMessage(text ?? 'The check did not return results.');
          return;
        }
        const byStatus = (statuses) => data.results.filter((item) => statuses.includes(item.status));
        const free = byStatus([Status.Available, Status.LikelyAvailable]);
        const taken = byStatus([Status.Taken]);
        const reserved = byStatus([Status.Reserved]);
        const unknown = byStatus([Status.Unknown]);

        const parts = [element('p', 'summary', summaryText(data, free, taken, reserved, unknown))];
        if (free.length) parts.push(...freeRows(free));
        if (taken.length) parts.push(group('Taken', taken, takenChip));
        if (reserved.length) parts.push(group('Reserved', reserved, (item) => plainChip(item, 'chip chip--reserved')));
        if (unknown.length) {
          parts.push(group('Not verified, try again later', unknown, (item) => plainChip(item, 'chip chip--unknown')));
        }
        if (data.warnings?.length) parts.push(notes(data.warnings));
        parts.push(
          element(
            'p',
            'footnote',
            'Registrars are listed cheapest first. Prices are standard yearly prices for the TLD; ' +
              'premium names cost more.' +
              (data.disclosure ? ` ${data.disclosure}` : ''),
          ),
        );
        showPanel(...parts);
      }

      /** "48 names checked in 4.2s: 23 free, 25 taken", naming the TLD when there is only one. */
      function summaryText(data, free, taken, reserved, unknown) {
        const seconds = (data.summary.elapsed_ms / SECOND_MS).toFixed(1);
        const tlds = new Set(data.results.map((item) => item.tld));
        const onlyTld = tlds.size === 1 ? ` .${[...tlds][0]}` : '';
        const counts = [`${free.length} free${onlyTld}`, `${taken.length} taken`];
        if (reserved.length) counts.push(`${reserved.length} reserved`);
        if (unknown.length) counts.push(`${unknown.length} not verified`);
        return `${data.summary.total} names checked in ${seconds}s: ${counts.join(', ')}`;
      }

      /** The free domains' rows, the first FREE_SHOWN of them until "…and N more free". */
      function freeRows(free) {
        const list = element('ul', 'results');
        free.slice(0, FREE_SHOWN).forEach((item) => list.append(freeRow(item)));
        if (free.length <= FREE_SHOWN) return [list];
        const more = element('button', 'more', `…and ${free.length - FREE_SHOWN} more free`);
        more.addEventListener('click', () => {
          free.slice(FREE_SHOWN).forEach((item) => list.append(freeRow(item)));
          more.remove();
        });
        return [list, more];
      }

      function freeRow(item) {
        const row = element('li', 'result');
        row.append(element('span', 'result__domain', item.display || item.domain));
        const pill = item.premium
          ? element('span', 'pill pill--premium', 'Premium')
          : element('span', 'pill', 'Available');
        if (item.confirmedBy) pill.title = `Confirmed by ${item.confirmedBy}`;
        row.append(pill);

        // The tool lists offers cheapest first, priced ones before the rest: one order for every
        // row, the buttons and the accordion alike.
        const offers = item.buy ?? [];
        const lead = offers.find((offer) => offer.price);
        // The price and the buy buttons share a line, which wraps on a narrow screen.
        const line = element('div', 'result__line');
        if (lead) line.append(element('span', 'result__price', priceText(lead)));
        row.append(line);
        if (!offers.length) return row;

        const actions = element('div', 'result__actions');
        for (const offer of offers.slice(0, ROW_BUTTONS)) actions.append(buyButton(offer));
        line.append(actions);
        if (offers.length > ROW_BUTTONS) {
          const list = registrarList(offers);
          actions.append(accordionToggle(offers.length, list));
          row.append(list);
        }
        return row;
      }

      /** "$10.46/yr at Cloudflare", with the renewal when it differs and any minimum term. */
      function priceText(offer) {
        const { price } = offer;
        const parts = [`${money(price.registration, price.currency)}/yr at ${offer.registrar}`];
        if (price.renewal !== price.registration) parts.push(`renews at ${money(price.renewal, price.currency)}`);
        if (price.minYears > 1) parts.push(`${price.minYears}${NO_BREAK_HYPHEN}year${NO_BREAK_SPACE}minimum`);
        return parts.join(', ');
      }

      function buyButton(offer) {
        const label = offer.price
          ? `${offer.registrar} ${money(offer.price.registration, offer.price.currency)}`
          : offer.registrar;
        const button = element('button', 'buy', label);
        button.append(element('span', 'arrow', OUT_ARROW));
        button.addEventListener('click', () => openLink(offer.url));
        return button;
      }

      /** "All N registrars ▾": opens and closes the list under the row. */
      function accordionToggle(count, list) {
        const toggle = element('button', 'toggle', `All ${count} registrars`);
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-controls', list.id);
        toggle.addEventListener('click', () => {
          const open = toggle.getAttribute('aria-expanded') !== 'true';
          toggle.setAttribute('aria-expanded', String(open));
          list.hidden = !open;
        });
        return toggle;
      }

      /** Every registrar that sells the name, in the tool's order. */
      function registrarList(offers) {
        const list = element('ul', 'registrars');
        list.id = `registrars-${nextListId++}`;
        list.hidden = true;
        for (const offer of offers) {
          const button = element('button', 'registrar');
          const price = offer.price
            ? `${money(offer.price.registration, offer.price.currency)}/yr`
            : 'price on site';
          button.append(element('span', '', offer.registrar), element('span', 'registrar__price', `${price} ${OUT_ARROW}`));
          button.addEventListener('click', () => openLink(offer.url));
          const item = element('li');
          item.append(button);
          list.append(item);
        }
        return list;
      }

      function group(label, items, chip) {
        const box = element('div', 'group');
        const chips = element('div', 'chips');
        for (const item of items) chips.append(chip(item));
        box.append(element('p', 'group__label', `${label} · ${items.length}`), chips);
        return box;
      }

      function takenChip(item) {
        const dropping = item.registration?.dropping;
        const chip = element('span', dropping ? 'chip chip--dropping' : 'chip', item.display || item.domain);
        const expires = item.registration?.expires?.slice(0, DATE_LENGTH);
        if (dropping) chip.title = 'Being deleted: may become available soon';
        else if (expires) chip.title = `Registered until ${expires}`;
        return chip;
      }

      function plainChip(item, className) {
        const chip = element('span', className, item.display || item.domain);
        if (item.note) chip.title = item.note;
        return chip;
      }

      function notes(warnings) {
        const list = element('ul', 'notes');
        for (const warning of warnings) list.append(element('li', '', warning));
        return list;
      }

      // ── Start: introduce the card, take the host's look, then follow the content's size ──────

      /** The system's theme, until the host says which one it uses. */
      const LIGHT_SCHEME_QUERY = '(prefers-color-scheme: light)';

      async function start() {
        document.documentElement.dataset.theme = window.matchMedia(LIGHT_SCHEME_QUERY).matches ? 'light' : 'dark';
        const result = await request(Method.Initialize, {
          appInfo: APP_INFO,
          appCapabilities: {},
          protocolVersion: PROTOCOL_VERSION,
        });
        applyHostContext(result?.hostContext);
        notify(Method.Initialized);
        const observer = new ResizeObserver(() => requestAnimationFrame(reportSize));
        observer.observe(document.documentElement);
        observer.observe(document.body);
        reportSize();
      }

      start();
    </script>
  </body>
</html>

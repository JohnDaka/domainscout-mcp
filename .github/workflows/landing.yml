# The landing page goes out on every change to site/ that reaches main: the merge is the release.
# Its site/ goes to a new release folder on the box, named after the commit, and `current` is
# pointed at it; nginx serves `current` to domainscout.dakaio.com. Five releases stay on the box.
# Actions → landing → Run workflow puts main out again by hand.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      the box: its IP (not a name behind Cloudflare's proxy)
#   DEPLOY_USER      deploy
#   DEPLOY_SSH_KEY   the private half of a key in deploy's authorized_keys
name: landing

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

concurrency:
  group: landing-deploy
  cancel-in-progress: false

env:
  RELEASES_DIR: /var/www/domainscout/releases
  CURRENT_LINK: /var/www/domainscout/current

jobs:
  deploy:
    # main only: a run by hand on a branch would put out whatever the branch has.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://domainscout.dakaio.com
    steps:
      - uses: actions/checkout@v4
      # The release's name: when it went out and from which commit, so the folders sort by time.
      - name: Name the release
        run: echo "RELEASE=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      # Which release this is, for the browser console (site/version.js).
      - name: Stamp the release
        run: |
          node -e "
            const stamp = { version: process.env.RELEASE, commit: process.env.GITHUB_SHA, built: new Date().toISOString() };
            require('fs').writeFileSync('site/version.json', JSON.stringify(stamp) + '\n');
          "
      # The pages are never cached but the stylesheet and scripts are, for hours: each release asks
      # for them under its own commit, so a new page never meets an old stylesheet.
      - name: Version the assets
        run: |
          stamp="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"/(styles\.css|main\.js|version\.js)\"#\1=\"/\2?v=${stamp}\"#g" site/*.html
          grep -c "?v=${stamp}" site/index.html
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust the box
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      # package.json describes the folder and is not a page.
      - name: Upload as a new release
        run: |
          rsync -az --delete --exclude package.json site/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$RELEASES_DIR/$RELEASE/"
      # The heredoc is unquoted on purpose: the variables are the runner's. Five releases stay.
      - name: Go live
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<EOF
            set -e
            ln -sfn "$RELEASES_DIR/$RELEASE" "$CURRENT_LINK"
            ls -1dt "$RELEASES_DIR"/*/ | tail -n +6 | xargs -r rm -rf
            curl -fsSk --resolve domainscout.dakaio.com:443:127.0.0.1 https://domainscout.dakaio.com/version.json
          EOF
